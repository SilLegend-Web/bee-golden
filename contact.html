<style>

</style></head><body>
<nav><a class="lg" href="index.html">Bee Golden</a><div class="links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html" >About</a><a href="contact.html" class="act">Contact</a></div><a id="bag" href="shop.html">Bag 0</a></nav>
<header class="hd"><h1 id="ttl"></h1><p>Tell us what you need. We reply with fabric options, prices and a fitting time.</p></header>

<script>(async()=>{
const $=s=>document.querySelector(s);
const SITE=await(async()=>{for(const u of ['/api/site-data','/data/default.json']){try{const r=await fetch(u,{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&Array.isArray(d.products)&&d.products.length)return d}}catch(e){}}return null})();
const SET=(SITE&&SITE.settings)||{},PRODS=SITE?SITE.products.filter(p=>p.vis!==false):[];

/* EDIT YOUR DETAILS HERE */

const cards=[['Call us',CFG.phone,CFG.phone.replace(/\D/g,'').length>8?'tel:'+CFG.phone.replace(/[^+\d]/g,''):'','Call now'],['WhatsApp',CFG.wa?'+'+CFG.wa.replace(/(\d{3})(\d{2})(\d{3})(\d{4})/,'$1 $2 $3 $4'):'Add your WhatsApp number',CFG.wa?'https://wa.me/'+CFG.wa:'','Chat now'],['Email',CFG.email,'mailto:'+CFG.email,'Write to us'],['Visit us',CFG.address,'','']];
$('#ic').innerHTML=cards.map(c=>`<div class="t3 rv"><div><small>${c[0]}</small><b>${c[1]}</b>${c[2]?`<a href="${c[2]}" target="_blank" rel="noopener">${c[3]}</a>`:''}</div></div>`).join('')+`<div class="t3 rv"><div><small>Opening hours</small><b>${CFG.hours}</b></div></div>`;
document.querySelectorAll('.t3').forEach(c=>{c.onpointermove=e=>{if(matchMedia('(hover:none),(prefers-reduced-motion:reduce)').matches)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.setProperty('--ry',x*14+'deg');c.style.setProperty('--rx',-y*14+'deg')};c.onpointerleave=()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
$('#ad').textContent=CFG.address;$('#gm').href=CFG.mapsUrl||'https://www.google.com/maps/search/?api=1&query='+(CFG.lat!=null?CFG.lat+','+CFG.lng:encodeURIComponent(CFG.address));
const msg=()=>{const v=id=>$('#'+id).value.trim();return 'Hello Bee Golden Collections, I am '+(v('nm')||'a customer')+'. I am interested in: '+$('#in').value+'. '+v('ms')+(v('ph')?' My number: '+v('ph'):'')};
$('#sw').onclick=()=>{if(!CFG.wa)return toast('WhatsApp number is not set up yet. Try email.');window.open('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent(msg()),'_blank')};
$('#se').onclick=()=>{location.href='mailto:'+CFG.email+'?subject='+encodeURIComponent('Enquiry from the website')+'&body='+encodeURIComponent(msg())};
/* 3D map */
(function(){let R,S,C;const el=$('#mw');
try{R=new THREE.WebGLRenderer({antialias:true});}catch(e){el.insertAdjacentHTML('afterbegin','<p style="padding:30px;color:#cdbf9c">3D map is not available on this device.</p>');return}
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;el.insertBefore(R.domElement,el.firstChild);
S=new THREE.Scene();S.background=new THREE.Color(0x1a130a);S.fog=new THREE.Fog(0x1a130a,45,100);C=new THREE.PerspectiveCamera(45,1,.1,200);
S.add(new THREE.AmbientLight(0xffffff,.6));const sun=new THREE.DirectionalLight(0xfff1d0,.9);sun.position.set(14,22,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);const sc=sun.shadow.camera;sc.left=-26;sc.right=26;sc.top=26;sc.bottom=-26;S.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85}),gr=new THREE.Mesh(new THREE.PlaneGeometry(70,70),M(0x2b2418));gr.rotation.x=-1.5708;gr.receiveShadow=true;S.add(gr);
const RD=[-12,-4,4,12];RD.forEach(v=>{[[2.2,.03,70,v,0],[70,.03,2.2,0,v]].forEach(a=>{const r=new THREE.Mesh(new THREE.BoxGeometry(a[0],a[1],a[2]),M(0x4a4030));r.position.set(a[3],.02,a[4]);r.receiveShadow=true;S.add(r)})});
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647,PL=[0x6b5a3e,0x8a7452,0xa8956b,0x5c4b32,0xc7b48a];
[-16,-8,0,8,16].forEach(bx=>[-16,-8,0,8,16].forEach(bz=>[-1.5,1.5].forEach(ox=>[-1.5,1.5].forEach(oz=>{if(bx==0&&bz==0&&ox>0&&oz>0)return;const h=.8+rnd()*(3.2-Math.hypot(bx,bz)*.07),b=new THREE.Mesh(new THREE.BoxGeometry(2.3,h,2.3),M(PL[Math.floor(rnd()*5)]));b.position.set(bx+ox,h/2,bz+oz);b.castShadow=b.receiveShadow=true;S.add(b)}))));
const sh=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.8,2.4),new THREE.MeshStandardMaterial({color:0xd4a017,roughness:.4,metalness:.5,emissive:0x4a3500}));sh.position.set(1.5,1.4,1.5);sh.castShadow=true;S.add(sh);
for(let i=0;i<28;i++){const x=(rnd()-.5)*60,z=(rnd()-.5)*60;if(RD.some(r=>Math.abs(x-r)<1.6||Math.abs(z-r)<1.6))continue;const t=new THREE.Mesh(new THREE.ConeGeometry(.5,1.4,8),M(0x3f6b3a));t.position.set(x,.7,z);t.castShadow=true;S.add(t)}
const pin=new THREE.Group(),pb=new THREE.Mesh(new THREE.SphereGeometry(.55,24,16),new THREE.MeshStandardMaterial({color:0xffc83d,emissive:0x7a5200,metalness:.6,roughness:.3})),pc=new THREE.Mesh(new THREE.ConeGeometry(.5,1.2,24),pb.material);pc.rotation.x=Math.PI;pc.position.y=-.85;pin.add(pb,pc);pin.position.set(1.5,5,1.5);S.add(pin);
const rg=new THREE.Mesh(new THREE.RingGeometry(1.6,1.9,48),new THREE.MeshBasicMaterial({color:0xd4a017,transparent:true,side:THREE.DoubleSide}));rg.rotation.x=-1.5708;rg.position.set(1.5,.08,1.5);S.add(rg);
const lc=document.createElement('canvas');lc.width=512;lc.height=96;const lx=lc.getContext('2d');lx.fillStyle='rgba(18,12,6,.85)';lx.fillRect(0,0,512,96);lx.strokeStyle='#d4a017';lx.lineWidth=4;lx.strokeRect(2,2,508,92);lx.fillStyle='#d4a017';lx.font='700 40px Georgia,serif';lx.textAlign='center';lx.fillText('Bee Golden Collections',256,62);
const lb=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(lc)}));lb.scale.set(7,1.3,1);lb.position.set(1.5,7.2,1.5);S.add(lb);
const cars=[0,1,2,3,4,5].map(i=>{const c=new THREE.Mesh(new THREE.BoxGeometry(1,.5,.5),M([0xe6e0d0,0xb33,0x225,0xd4a017][i%4]));c.castShadow=true;const h=i%2,r=RD[i%4];c.userData={h,r,s:(.03+rnd()*.04)*(i%3?1:-1),p:(rnd()-.5)*60};if(h)c.rotation.y=1.5708;S.add(c);return c});
let az=.8,ev=1,dist=36,dr=false,lx0=0,ly0=0,idle=0;const T=new THREE.Vector3(0,1.5,0),red=matchMedia('(prefers-reduced-motion:reduce)').matches;
el.onpointerdown=e=>{dr=true;lx0=e.clientX;ly0=e.clientY;el.setPointerCapture(e.pointerId)};
el.onpointermove=e=>{if(!dr)return;az-=(e.clientX-lx0)*.008;ev=Math.max(.3,Math.min(1.35,ev+(e.clientY-ly0)*.006));lx0=e.clientX;ly0=e.clientY;idle=180};
el.onpointerup=()=>dr=false;
$('#zi').onclick=()=>dist=Math.max(14,dist*.82);$('#zo').onclick=()=>dist=Math.min(52,dist*1.2);$('#zr').onclick=()=>{az=.8;ev=1;dist=36};
let vis=true,off=false;window.__stopIll=()=>{off=true;R.domElement.style.display='none'};new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(el);
function fit(){const w=el.clientWidth,h=el.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}addEventListener('resize',fit);fit();
(function loop(t){requestAnimationFrame(loop);if(!vis||off)return;t*=.001;if(!dr&&!red){if(idle>0)idle--;else az+=.0016}
C.position.set(T.x+dist*Math.sin(ev)*Math.sin(az),T.y+dist*Math.cos(ev),T.z+dist*Math.sin(ev)*Math.cos(az));C.lookAt(T);
pin.position.y=5+Math.sin(t*2)*.3;pin.rotation.y=t;const k=(t%2)/2;rg.scale.setScalar(1+k*.8);rg.material.opacity=1-k;
if(!red)cars.forEach(c=>{const u=c.userData;u.p+=u.s;if(u.p>35)u.p=-35;if(u.p<-35)u.p=35;if(u.h)c.position.set(u.p,.3,u.r+(u.s>0?.5:-.5));else c.position.set(u.r+(u.s>0?.5:-.5),.3,u.p)});
R.render(S,C)})(0)})();
/* real 3D map (MapLibre + OpenFreeMap, no API key) */
(async function(){
const rm=$('#rm');if(typeof maplibregl==='undefined')return;
async function geo(){
 if(CFG.lat!=null)return{lat:CFG.lat,lng:CFG.lng};
 try{const c=JSON.parse(localStorage.getItem('bgmap')||'null');if(c&&c.a==CFG.address)return c}catch(e){}
 const qs=[CFG.address,CFG.address.replace(/\s*\(.*?\)/,''),...CFG.geo];
 for(let i=0;i<qs.length;i++){try{if(i)await new Promise(r=>setTimeout(r,1100));const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(qs[i])).then(x=>x.json());
  if(r&&r[0]){const c={a:CFG.address,lat:+r[0].lat,lng:+r[0].lon};try{localStorage.setItem('bgmap',JSON.stringify(c))}catch(e){}return c}}catch(e){return null}}
 return null}
const g=await geo();if(!g)return;
const map=new maplibregl.Map({container:rm,style:'https://tiles.openfreemap.org/styles/liberty',center:[g.lng,g.lat],zoom:16.3,pitch:62,bearing:-20});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
const mk=document.createElement('div');mk.className='pin3';mk.textContent='Bee Golden Collections';
new maplibregl.Marker({element:mk,anchor:'bottom'}).setLngLat([g.lng,g.lat]).addTo(map);
map.on('load',()=>{rm.classList.add('on');if(window.__stopIll)window.__stopIll();const a=$('.mc'),b=$('.mn');if(a)a.style.display='none';if(b){b.textContent='Drag to pan. Right-drag or use two fingers to tilt and rotate.';b.style.zIndex=3}map.resize();
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)map.easeTo({bearing:20,duration:9000,easing:t=>t})});
setTimeout(()=>{if(!rm.classList.contains('on')){try{map.remove()}catch(e){}}},20000);
})();

})();</script></body></html>
